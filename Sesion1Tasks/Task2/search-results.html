<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechVision Store - Search Results</title>
</head>
<body>
    <header>
    <h1>TechVision Store</h1>
    <nav>
        <a href="#">Home</a> |
        <a href="#">Account</a> |
        <a href="#">Orders</a> |
        <a href="#">Cart</a>
    </nav>
    <form action="#">
        <label for="search">Search Products:</label>
        <input
            type="search"
            id="search"
            name="search"
            placeholder="Search for products">
        <button type="submit">
            Search
        </button>
    </form>
</header>
<nav aria-label="Breadcrumb">
    <ol>
        <li><a href="#">Home</a></li>
        <li><a href="#">Electronics</a></li>
        <li>Smartphones</li>
    </ol>
</nav>
<main>
    <aside>
        <h2>Filter Products</h2>
        <form>
            <fieldset>
                <legend>Brand</legend>
                <label>
                    <input type="checkbox" name="brand" value="TechVision">
                    TechVision
                </label>
                <br>
                <label>
                    <input type="checkbox" name="brand" value="SmartTech">
                    SmartTech
                </label>
                <br>
                <label>
                    <input type="checkbox" name="brand" value="NovaPhone">
                    NovaPhone
                </label>
            </fieldset>
            <br>
            <fieldset>
            <legend>Minimum Rating</legend>
                <label>
                    <input type="radio" name="rating" value="4">
                    4 Stars & Up
                </label>
                <br>
                <label>
                    <input type="radio" name="rating" value="3">
                    3 Stars & Up
                </label>
                <br>
                <label>
                    <input type="radio" name="rating" value="2">
                    2 Stars & Up
                </label>
            </fieldset>
            <br>
            <fieldset>
                <legend>Price Range</legend>
                <label for="min-price">Minimum Price</label>
                <input
                    type="number"
                    id="min-price"
                    name="min-price">
                <br><br>
                <label for="max-price">Maximum Price</label>
                <input
                    type="number"
                    id="max-price"
                    name="max-price">
            </fieldset>
            <br>
            <button type="submit">
                Apply Filters
            </button>
        </form>
    </aside>
    <section>
    <h2>Search Results</h2>
    <p>Showing 6 results</p>
    <label for="sort">Sort By:</label>
    <select id="sort" name="sort">
        <option>Featured</option>
        <option>Price: Low to High</option>
        <option>Price: High to Low</option>
        <option>Newest</option>
    </select>
</main>
</body>
</html>
